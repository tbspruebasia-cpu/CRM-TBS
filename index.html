<style>
:root{
  --bg:#f1f4fa;--panel:#ffffff;--ink:#0b1b33;--mute:#64748b;--line:#e3e8f2;
  --brand:#2563eb;--brand2:#7c3aed;--leads:#0d9488;--call:#ea580c;--ok:#16a34a;--bad:#dc2626;
  --shadow:0 1px 2px rgba(11,27,51,.05),0 8px 24px -8px rgba(11,27,51,.12);
  --shadow-lg:0 2px 4px rgba(11,27,51,.06),0 18px 40px -12px rgba(30,58,138,.28);
  --hero1:#081230;--hero2:#14307a;--hero3:#5b21b6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080e1c;--panel:#101a2e;--ink:#e9eef8;--mute:#8b9ab3;--line:#1f2d47;
  --brand:#60a5fa;--brand2:#a78bfa;--leads:#2dd4bf;--call:#fb923c;--ok:#4ade80;--bad:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 18px 40px -12px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Figtree,system-ui,sans-serif;padding:0 0 56px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Figtree,sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}

/* ───── HERO ───── */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);padding-top:26px;box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(520px 260px at 88% -10%,rgba(168,139,250,.45),transparent 70%),
  radial-gradient(420px 240px at 8% 120%,rgba(45,212,191,.28),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 90%);mask-image:linear-gradient(to bottom,#000 0%,transparent 90%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:16px;align-items:center}
.logo{height:68px;width:auto;border-radius:12px;display:block;box-shadow:0 8px 22px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.25)}
h1{font-size:34px;line-height:1;margin:0;font-weight:800;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,#c7d2fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:13px}
.hero .sub{color:rgba(255,255,255,.72);margin-top:6px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7)}
.dot.load{background:#fbbf24}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}}
.acts{display:flex;gap:8px;flex-wrap:wrap}

button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
button:hover,select:hover{border-color:var(--brand);box-shadow:var(--shadow)}
button:active{transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hero .acts button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);font-weight:600}
.hero .acts button:hover{background:rgba(255,255,255,.22);border-color:#fff}
.hero .acts button.pri{background:#fff;color:#14307a;border-color:#fff}

nav{display:flex;gap:6px;margin:26px 0 0;overflow-x:auto;padding-bottom:0}
nav button{border:0;border-radius:12px 12px 0 0;background:transparent;padding:11px 20px;font-weight:600;color:rgba(255,255,255,.7);white-space:nowrap;box-shadow:none}
nav button:hover{color:#fff;background:rgba(255,255,255,.1);box-shadow:none}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink)}

/* ───── CONTENIDO ───── */
main.wrap{padding-top:24px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:2px 0 18px;gap:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.bar .sub{margin-top:2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c,var(--brand))}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--c,var(--brand));opacity:.08}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.kpi .lbl{color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi .num{font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-.03em;color:var(--c,var(--ink))}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 2px;font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.panel h3::before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(var(--brand),var(--brand2))}
.legend{display:flex;gap:18px;color:var(--mute);font-size:13px;margin:8px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mute);font:11px Figtree,sans-serif}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols .panel{margin-top:16px}
@media(max-width:760px){.cols{grid-template-columns:1fr}h1{font-size:28px}}

.row{display:grid;grid-template-columns:minmax(0,1.2fr) 2fr auto;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;min-width:28px;text-align:right}
.track{background:var(--bg);border-radius:99px;height:10px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--leads),var(--brand))}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s cubic-bezier(.2,.8,.2,1)}}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:color-mix(in srgb,var(--brand) 5%,var(--panel))}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
tbody tr:hover td{background:color-mix(in srgb,var(--brand) 5%,var(--panel))}
td:first-child{font-weight:600}
.msg{padding:36px;text-align:center;color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:16px}
.err{color:var(--bad)}

.gatebg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--hero1),var(--hero2) 55%,var(--hero3))}
.gatebg::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 85% 0%,rgba(168,139,250,.45),transparent 70%),radial-gradient(500px 300px at 0% 100%,rgba(45,212,191,.3),transparent 70%)}
.gate{position:relative;width:100%;max-width:400px;background:rgba(255,255,255,.96);color:#0b1b33;border-radius:22px;padding:32px 28px;box-shadow:0 30px 80px -10px rgba(0,0,0,.55);text-align:center}
@media (prefers-color-scheme:dark){.gate{background:rgba(16,26,46,.96);color:var(--ink)}}
.gate .logo{margin:0 auto 16px;height:120px;border-radius:16px;box-shadow:0 12px 30px -8px rgba(11,27,51,.5)}
.gate h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.gate .sub{margin-top:6px}
.gate input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:18px 0 12px;text-align:center;letter-spacing:.15em}
.gate button{width:100%;padding:12px;border:0;color:#fff;font-weight:700;background:linear-gradient(120deg,var(--hero2),var(--hero3));box-shadow:0 10px 24px -8px rgba(91,33,182,.6)}
.gate button:hover{filter:brightness(1.1)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.seg button{border:0;border-radius:0;box-shadow:none;font-weight:600}
.seg button[aria-pressed=true]{background:linear-gradient(120deg,var(--hero2),var(--hero3));color:#fff}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.mes{display:flex;align-items:center;gap:10px}
.mes h2{text-transform:capitalize;min-width:190px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dh{color:var(--mute);font-size:12px;text-align:center;padding:6px 0;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.dc{min-height:98px;text-align:left;padding:8px 9px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink);cursor:pointer}
.dc:hover:not(.futuro){transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.dc.vacio{visibility:hidden}
.dc.futuro{opacity:.35;cursor:default}
.dc.hoy{border:2px solid var(--brand2)}
.dc.sel{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:1px}
.dn{font-size:12px;color:var(--mute);font-weight:600}
.dt{font-size:24px;font-weight:800;line-height:1}
.chips{font-size:11px;color:var(--mute);display:flex;flex-direction:column;margin-top:auto}
tr.hoy td{font-weight:700;background:color-mix(in srgb,var(--brand2) 10%,var(--panel))}
tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.scroll{overflow-x:auto}
@media(max-width:640px){.chips{display:none}.dc{min-height:58px}.dt{font-size:18px}.mes h2{min-width:120px;font-size:20px}.logo{height:48px}}

/* ───── CRM: leads, cola de llamadas y detalle ───── */
:root{--hot:#e11d48;--warm:#f59e0b;--cold:#3b82f6}
@media (prefers-color-scheme:dark){:root{--hot:#fb7185;--warm:#fbbf24;--cold:#60a5fa}}
nav .cnt{background:var(--hot);color:#fff;font:700 11px Figtree;border-radius:99px;padding:1px 7px;margin-left:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:8px 14px;border-radius:99px}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--sc,var(--mute))}
.pill[aria-pressed=true]{background:var(--sc,var(--ink));color:#fff;border-color:transparent}
.pill[aria-pressed=true] i{background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px Figtree;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-Caliente{color:var(--hot);background:color-mix(in srgb,var(--hot) 12%,transparent)}
.t-Tibio{color:#b45309;background:color-mix(in srgb,var(--warm) 18%,transparent)}
@media(prefers-color-scheme:dark){.t-Tibio{color:var(--warm)}}
.t-Frío{color:var(--cold);background:color-mix(in srgb,var(--cold) 14%,transparent)}
.t-Sin{color:var(--mute);background:color-mix(in srgb,var(--mute) 12%,transparent)}
.e{color:var(--mute);background:color-mix(in srgb,var(--mute) 14%,transparent)}
.e-Inscrito{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.e-Contestó{color:var(--leads);background:color-mix(in srgb,var(--leads) 14%,transparent)}
.e-Volver{color:var(--call);background:color-mix(in srgb,var(--call) 14%,transparent)}
.e-No{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.sc{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.sc::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}
.al{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--hot) 30%,var(--line));background:color-mix(in srgb,var(--hot) 6%,var(--panel));margin-top:8px;cursor:pointer;text-align:left;width:100%}
.al:hover{border-color:var(--hot)}
.al .d{font:700 20px "Bricolage Grotesque";color:var(--hot);min-width:44px}
.al small{color:var(--mute);display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.filters input{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit}
.tag{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--brand2) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--brand2) 40%,var(--line));border-radius:99px;padding:6px 8px 6px 14px;font-weight:600;font-size:13px}
.tag button{padding:0 8px;border-radius:99px;border:0;background:var(--brand2);color:#fff;box-shadow:none}
.lt th,.lt td{text-align:left;vertical-align:middle}
.lt tbody tr{cursor:pointer}
.lt td.n{font-weight:600}.lt td.n small{display:block;color:var(--mute);font-weight:400}
.sn{color:var(--mute);font-style:italic;font-weight:500}
.sbar{display:inline-block;width:54px;height:7px;border-radius:9px;background:var(--bg);vertical-align:middle;margin-right:6px;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--warm),var(--hot))}
.wa,.tel{display:inline-flex;align-items:center;gap:6px;border:0;font-weight:600;padding:6px 12px;border-radius:99px;font-size:13px;text-decoration:none;cursor:pointer}
.wa{background:#16a34a;color:#fff}.wa:hover{filter:brightness(1.1)}
.tel{background:color-mix(in srgb,var(--brand) 14%,var(--panel));color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line))}
.ghost{padding:6px 12px;font-size:13px}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px;box-shadow:var(--shadow);border-left:5px solid var(--sc,var(--cold))}
.q .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 17px "Bricolage Grotesque";background:linear-gradient(135deg,var(--hero2),var(--hero3))}
.q h4{margin:0;font-size:16px;cursor:pointer}.q h4:hover{text-decoration:underline}
.q .m{color:var(--mute);font-size:13px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts .ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok);font-weight:600}
.acts .rl{border-color:color-mix(in srgb,var(--call) 50%,var(--line));color:var(--call);font-weight:600}
.acts .no{color:var(--mute)}
.q button:disabled,.save:disabled{opacity:.5;cursor:wait}
@media(max-width:760px){.q{grid-template-columns:auto 1fr}.q .acts{grid-column:1/-1;justify-content:flex-start}}
.ov{position:fixed;inset:0;background:rgba(5,10,25,.55);backdrop-filter:blur(3px);display:flex;justify-content:flex-end;z-index:20}
.dr{width:min(470px,100%);height:100%;background:var(--panel);padding:22px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.35);border-top:6px solid var(--sc,var(--brand2))}
.dr h2{margin:0 0 4px;font-size:24px;text-transform:none;min-width:0;text-align:left}
.dr .f{display:grid;grid-template-columns:130px 1fr;gap:10px 12px;margin:14px 0;font-size:14px;align-items:center}
.dr .f>span:nth-child(odd){color:var(--mute)}
.dr input[type=text],.dr input[type=date],.dr select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.dr textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.resumen{background:color-mix(in srgb,var(--brand2) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--brand2) 25%,var(--line));border-radius:14px;padding:12px 14px;font-size:14px;margin:6px 0 14px}
.resumen small{display:block;color:var(--brand2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:4px}
.obs{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:8px}
.save{background:linear-gradient(120deg,var(--hero2),var(--hero3));color:#fff;border:0;font-weight:700;padding:10px 18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;font-weight:600;max-width:92vw}
.toast.mal{background:var(--bad);color:#fff}
.foot{margin-top:24px;text-align:center;color:var(--mute);font-size:12px}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.mhead b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.mhead span{color:var(--mute);font-size:13px}
.mtrack{background:var(--bg);border-radius:99px;height:14px;overflow:hidden}
.mfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand2),var(--brand))}
.mfill.ok{background:linear-gradient(90deg,var(--leads),var(--ok))}
.mrow.tot .mtrack{height:18px}.mrow.tot .mhead b{font-size:19px}
@media (prefers-reduced-motion:no-preference){.mfill{transition:width .5s cubic-bezier(.2,.8,.2,1)}}
</style>

/* ═══ CARRERAS OFICIALES: solo estas 8 se cuentan en "Carrera de interés" ═══ */
const CARRERAS = [
  ['Diseño Gráfico', ['diseno grafico','diseno']],
  ['Contaduría General', ['contaduria']],
  ['Comercio Internacional y Administración Aduanera', ['comercio internacional','aduanera','aduana']],
  ['Mercadotecnia', ['mercadotecnia','marketing']],
  ['Administración de Empresas', ['administracion de empresas']],
  ['Parvulario y Crecimiento Personal en la Infancia', ['parvulario','crecimiento personal']],
  ['Idioma Inglés', ['ingles']],
  ['Redes y Sistemas de Comunicación', ['redes']]
];
const normTxt = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function canonCarrera(k) { const t = normTxt(k); for (const [nom, keys] of CARRERAS) if (keys.some(x => t.includes(x))) return nom; return null; }

const hoyMes = () => new Intl.DateTimeFormat('en-CA', { timeZone:'America/La_Paz' }).format(new Date()).slice(0, 7);
const $app = document.getElementById('app');
const st = { tab:'total', dias:14, mes:hoyMes(), metrica:'leads', vista:'cal', dia:null, data:{}, err:{}, cargando:false, ult:null,
  sinAcceso:{}, leads:{}, errLeads:{}, recortado:{}, cargandoLeads:false, leadsListo:false, guardando:{}, sel:null, pend:false,
  q:'', sedeF:'', carrera:'', ll:'', temp:'', ing:'' };
const FETCH_TIMEOUT_MS = 7000;
async function fetchConTimeout(url, ms = FETCH_TIMEOUT_MS) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    return await fetch(url, { signal: controller.signal, cache:'no-store' });
  } finally {
    clearTimeout(timer);
  }
}

const getKey = () => { try { return localStorage.getItem('dash_key') || ''; } catch { return ''; } };
const setKey = k => { try { localStorage.setItem('dash_key', k); } catch {} };
const clearKey = () => { try { localStorage.removeItem('dash_key'); } catch {} };
const el = (t, a = {}, ...kids) => { const n = document.createElement(t); for (const k in a) { const v = a[k]; if (v === null || v === undefined || v === false) continue; k === 'class' ? n.className = v : k.startsWith('on') ? n.addEventListener(k.slice(2), v) : n.setAttribute(k, v); } kids.flat(9).forEach(c => { if (c !== null && c !== undefined && c !== false) n.append(c instanceof Node ? c : document.createTextNode(c)); }); return n; };
const NS = 'http://www.w3.org/2000/svg';
const sv = (t, a = {}, ...kids) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); kids.forEach(c => n.append(c instanceof Node ? c : document.createTextNode(c))); return n; };

const hoyISO = () => new Intl.DateTimeFormat('en-CA', { timeZone:'America/La_Paz' }).format(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const rango = n => { const h = hoyISO(); return Array.from({ length:n }, (_, i) => addDays(h, i - (n - 1))); };
const corto = iso => iso.slice(8) + '/' + iso.slice(5, 7);

async function loadSede(s) {
  if (!s.url) {
    st.err[s.id] = 'Falta la URL de esta sede en index.html';
    renderSuave();
    return;
  }
  try {
    const r = await fetchConTimeout(`${s.url}?dashboard=1&key=${encodeURIComponent(getKey())}&_=${Date.now()}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Error');
    st.data[s.id] = j;
    delete st.err[s.id];
    delete st.sinAcceso[s.id];
    renderSuave(); // muestra esta sede inmediatamente, sin esperar las demás
  } catch (e) {
    const msg = e && e.name === 'AbortError' ? 'Tiempo de espera agotado' : (e.message || 'Error');
    if (/clave/i.test(msg)) {          // este código no abre esta sede: simplemente no se muestra
      st.sinAcceso[s.id] = true;
      delete st.err[s.id];
      delete st.data[s.id];
    } else {
      st.err[s.id] = msg;
    }
    renderSuave();
  }
}
async function loadAll() {
  if (st.cargando || !getKey()) return;
  st.cargando = true;
  renderSuave(); // interfaz inmediata
  await Promise.allSettled(SEDES.map(loadSede));
  if (SEDES.every(s => st.sinAcceso[s.id])) {   // el código no abre NINGUNA sede: es incorrecto
    clearKey(); st.claveMala = true; reiniciarDatos(); st.cargando = false; render(); return;
  }
  await Promise.allSettled([loadLeads(), loadInsc()]);
  st.cargando = false;
  st.ult = new Date();

  });
  frag.append(el('div', { class:'panel' }, el('h3', {}, `${nombreM} por día`), el('div', { class:'sub', style:'margin:4px 0 12px' }, 'Más intenso = más movimiento. Toca un día para ver el detalle por sede.'), grid));

  if (st.dia) {

const EST_LL = ['Pendiente', 'Contestó', 'No contestó', 'Volver a llamar', 'Se inscribió', 'No interesado'];

// Si el detalle está abierto no se redibuja la pantalla (así no se pierde lo que el asesor está escribiendo)
function renderSuave() { if (st.sel) st.pend = true; else render(); }

function toast(m, mal) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.className = 'toast' + (mal ? ' mal' : '');
  t.textContent = m;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.remove(), mal ? 6000 : 2600);
}

async function apiSede(s, params, ms = 25000) {
  const q = new URLSearchParams({ ...params, key:getKey(), _:Date.now() });
  let r;
  try { r = await fetchConTimeout(`${s.url}?${q}`, ms); }
  catch (e) { throw new Error(e && e.name === 'AbortError' ? 'Tiempo de espera agotado' : 'Sin conexión con la sede'); }
  let j;
  try { j = JSON.parse(await r.text()); }
  catch { throw new Error('La sede no respondió con datos. ¿Ya publicaste la nueva versión del Apps Script (CRM_API)?'); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j;
}

const diasDesde = iso => iso ? Math.round((new Date(hoyISO() + 'T12:00:00Z') - new Date(iso + 'T12:00:00Z')) / 864e5) : null;
function prep(l, s) {
  l.sede = s.id; l.sedeNom = s.nombre; l.key = s.id + '|' + l.tel;
  l.dias = diasDesde(l.primer);
  l.carr = canonCarrera(l.carrera) || l.carrera || 'Sin carrera';
  l.sinNombre = !l.nombre || /^(no identificado|desconocido|sin nombre)$/i.test(l.nombre);
  return l;
}
async function loadLeads() {
  if (st.cargandoLeads || !getKey()) return;
  st.cargandoLeads = true;
  await Promise.allSettled(sedesOk().map(async s => {
    try {
      const j = await apiSede(s, { crm:'leads' });
      st.leads[s.id] = j.leads.map(l => prep(l, s));
      st.recortado[s.id] = !!j.recortado;
      delete st.errLeads[s.id];
    } catch (e) {
      if (/clave/i.test(e.message)) { st.sinAcceso[s.id] = true; delete st.leads[s.id]; }
      else st.errLeads[s.id] = e.message;
    }
  }));
  st.cargandoLeads = false;
  st.leadsListo = true;
  renderSuave();
}

const todos = ids => sedesOk().filter(s => !ids || ids.includes(s.id)).flatMap(s => st.leads[s.id] || []);
const findLead = key => todos().find(l => l.key === key);
const cerrado = l => l.inscrito || l.noInt || l.baja || /^(inscrito|no interesado)$/i.test(l.estadoLead) || ['Se inscribió', 'No interesado'].includes(l.ll) || ['Se inscribió', 'No interesado'].includes(l.res);
const sinLlamar = l => !l.ll || l.ll === 'Pendiente';
const enCola = l => {
  if (cerrado(l)) return false;
  const h = hoyISO();
  if (l.prox) return l.prox <= h;                               // reprogramada: aparece solo cuando llega su fecha (hoy o atrasada)
  return ['', 'Pendiente', 'Volver a llamar'].includes(l.ll || ''); // "No contestó" sin fecha = intentos hechos, sin interés: no figura
};
// Ya hubo un primer contacto y quedó con fecha futura: cuenta como llamada hecha, no como pendiente
const reprogramada = l => !cerrado(l) && !sinLlamar(l) && !!l.prox && l.prox > hoyISO();
const fechaLarga = iso => iso ? corto(iso) : '';
const rankTemp = l => ({ Caliente:0, Tibio:1, '':2, 'Frío':3 })[l.temp] ?? 2;
const cola = () => todos().filter(enCola).sort((a, b) => rankTemp(a) - rankTemp(b) || b.score - a.score);
const alertas = ids => todos(ids).filter(l => !cerrado(l) && sinLlamar(l) && (l.temp === 'Caliente' || l.score >= 75) && (l.dias || 0) >= 1).sort((a, b) => b.dias - a.dias);

const tChip = t => el('span', { class:'chip t-' + (t || 'Sin') }, t || 'Sin clasificar');
const eCls = e => 'chip e e-' + ({ 'Se inscribió':'Inscrito', 'Contestó':'Contestó', 'Volver a llamar':'Volver', 'No contestó':'No', 'No interesado':'No' }[e] || 'x');
const eChip = e => el('span', { class: !e || e === 'Pendiente' ? 'chip e' : eCls(e) }, e || 'Pendiente');
// Chip de llamada por persona: si está reprogramada se ve como llamada hecha con nota de fecha
const llChip = l => reprogramada(l)

// Guarda en la hoja y actualiza la persona con lo que devolvió la sede
async function guardar(l, cambios, okMsg) {
  const s = sedePorId(l.sede);
  st.guardando[l.key] = true;
  if (!st.sel) render();
  try {
    const j = await apiSede(s, { crm:'guardar', tel:l.tel, ...cambios });
    if (j.lead) {
      const lista = st.leads[l.sede] || [], i = lista.findIndex(x => x.tel === l.tel);
      const nuevo = prep(j.lead, s);
      if (i >= 0) lista[i] = nuevo; else lista.unshift(nuevo);
    }
    toast(okMsg || 'Guardado en la hoja de ' + s.nombre);
    return true;
  } catch (e) {
    toast('No se guardó: ' + e.message, true);
    return false;
  } finally {
    delete st.guardando[l.key];
    if (st.sel === l.key) { /* el detalle decide cuándo cerrar */ } else render();
  }
}

function render() {

  if (!tabs.some(t => t.id === st.tab)) st.tab = 'total';
  const nCola = st.leadsListo ? cola().length : 0;
  const estado = st.cargando ? 'Cargando datos…' : st.ult ? 'Actualizado ' + st.ult.toLocaleTimeString('es-BO', { hour:'2-digit', minute:'2-digit' }) : 'CRM listo';
  $app.append(
    el('header', { class:'hero' }, el('div', { class:'wrap' },
      el('div', { class:'top' },
        el('div', { class:'brand' }, el('img', { src:LOGO, alt:'Logo TBS', class:'logo' }), el('div', {}, el('h1', {}, 'CRM TBS'), el('div', { class:'sub' }, el('span', { class:'dot' + (st.cargando ? ' load' : '') }), estado))),
        el('div', { class:'acts' }, el('button', { class:'pri', onclick:loadAll }, 'Actualizar'), el('button', { onclick:cambiarCodigo }, 'Cambiar código'))),
      el('nav', { role:'tablist' }, tabs.map(t => el('button', { role:'tab', 'aria-selected':String(st.tab === t.id), onclick:() => { st.tab = t.id; render(); } },
        t.nombre, t.id === 'llamar' && nCola ? el('span', { class:'cnt' }, String(nCola)) : null))))));
  const main = el('main', { class:'wrap' });
  $app.append(main);
  if (st.tab === 'cal') main.append(vistaCalendario());
  else if (st.tab === 'leads') main.append(vistaLeads());
  else if (st.tab === 'llamar') main.append(vistaLlamar());
  else if (st.tab === 'metas') main.append(vistaMetas());
  else if (st.tab === 'total') {
    const ok = acc.filter(s => st.data[s.id]);
    if (!ok.length && !st.cargando) main.append(el('div', { class:'msg' }, 'Aún no hay sedes conectadas. Revisa las URL en index.html.'));
    else {
      const titulo = acc.length === 1 ? 'Sede ' + acc[0].nombre : 'Resumen general' + (ok.length < acc.length ? ` (${ok.length} de ${acc.length} conectadas)` : '');
      main.append(vistaDatos(agg(ok.map(s => st.data[s.id]), st.dias), titulo, acc.map(s => s.id)));
      if (acc.length > 1) main.append(tablaSedes());
    }
  } else {
    const s = SEDES.find(x => x.id === st.tab), j = st.data[s.id];
    if (j) main.append(vistaDatos(agg([j], st.dias), 'Sede ' + s.nombre, [s.id]));
    else main.append(el('div', { class:'msg' + (st.err[s.id] ? ' err' : '') }, st.cargando ? 'Cargando…' : (st.err[s.id] || 'Sin datos')));
  }
  const d = st.sel ? vistaDetalle() : null;
  if (d) $app.append(d); else if (st.sel) st.sel = null;
  window.scrollTo(0, sy);
}
render();
if (getKey()) setTimeout(loadAll, 0);
setInterval(() => { if (getKey()) setTimeout(loadAll, 0); }, REFRESCO_MS);
</script>
</body>
</html>
